      gap: 10px;

      border-radius: 16px;
      font-weight: 600;
      border: 1px solid #fbcfe8;
      display: flex;
      align-items: center;
      gap: 5px;

      gap: 18px;

      font-size: 0.85rem;

      font-weight: 700;

      display: inline-flex;
      align-items: center;
      gap: 5px;

    // 儲存所有播放器實體
    const players = {};

    // 當 YouTube IFrame API 準備就緒時初始化
    function onYouTubeIframeAPIReady() {
      episodesData.forEach(ep => {
        players[ep.id] = new YT.Player(`player-${ep.id}`, {
          videoId: ep.videoId,
          playerVars: {
            playsinline: 1,
            rel: 0,
            modestbranding: 1
          }
        });
      });
    }

    // 原生秒級跳轉與智慧播放
    function jumpTo(epId, seconds) {
      // 先暫停其他正在播放的集數
      Object.keys(players).forEach(key => {
        if (key !== epId && players[key] && typeof players[key].pauseVideo === 'function') {
          players[key].pauseVideo();
        }
      });

      const player = players[epId];
      if (player && typeof player.seekTo === 'function') {
        player.seekTo(seconds, true);
        player.playVideo();
      }

      // 滾動讓播放器保持在畫面中央
      const container = document.getElementById(`card-${epId}`);
      if (container) {
        container.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function renderEpisodes() {
      const container = document.getElementById('episodesContainer');
      container.innerHTML = episodesData.map(ep => {
        return `
          <div class="episode-card" id="card-${ep.id}">
            <div class="card-header">
              <div class="ep-meta">
                <span class="ep-number">${ep.epNum}</span>
                <h2 class="ep-title">${ep.title}</h2>
              </div>
              <div class="cast-tag">
                <i class="fa-solid fa-user-group"></i> ${ep.cast}
              </div>
            </div>

            <div class="card-body">
              <div class="info-pane">
                <div class="location-box">
                  <div class="loc-label"><i class="fa-solid fa-location-dot"></i> 外景拍攝地點</div>
                  <div class="loc-name">${ep.location.name}</div>
                  <div class="loc-links">
                    <a class="loc-link-btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ep.location.mapQuery)}" target="_blank" rel="noopener">
                      <i class="fa-solid fa-map-location-dot"></i> Google Maps
                    </a>
                  </div>
                </div>

                <div>
                  <div class="section-title">
                    <i class="fa-solid fa-utensils text-orange-500"></i> ${ep.isRestaurant ? '同款外食美饌品項' : '現場料理與食材品項'}
                  </div>
                  <div class="food-chips">
                    ${ep.foods.map(f => `<span class="food-chip"><i class="fa-solid fa-check"></i> ${f}</span>`).join('')}
                  </div>
                </div>

                <div>
                  <div class="section-title">
                    <i class="fa-regular fa-clock text-pink-500"></i> 精確時間軸（點擊直接切入秒數）
                  </div>
                  <div class="timeline-list">
                    ${ep.timeline.map(t => {
                      if (t.isEating) {
                        return `
                          <div class="timeline-item is-eating">
                            <div class="tl-left">
                              <button class="tl-btn" onclick="jumpTo('${ep.id}', ${t.sec})" title="跳轉至 ${t.time}">
                                <i class="fa-solid fa-play"></i> ${t.time}
                              </button>
                              <span class="tl-tag"><i class="fa-solid fa-utensils"></i> 開吃前5秒</span>
                              <div>
                                <span class="tl-eating-food">[${t.foodTitle}]</span>
                                <span class="tl-text"> ${t.text}</span>
                              </div>
                            </div>
                          </div>
                        `;
                      } else {
                        return `
                          <div class="timeline-item">
                            <div class="tl-left">
                              <button class="tl-btn" onclick="jumpTo('${ep.id}', ${t.sec})" title="跳轉至 ${t.time}">
                                <i class="fa-solid fa-play"></i> ${t.time}
                              </button>
                              <span class="tl-text">${t.text}</span>
                            </div>
                          </div>
                        `;
                      }
                    }).join('')}
                  </div>
                </div>
              </div>

              <div class="player-container">
                <div class="video-viewport">
                  <div id="player-${ep.id}"></div>
                </div>
                <div class="player-ctrl-bar">
                  <span><i class="fa-brands fa-youtube text-red-500"></i> 官方正版播放器</span>
                  <span>原生 API 控制</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderEpisodes();
    });
  </script>
