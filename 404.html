<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — SakakiFu</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
  <style>
    :root { --bg: #f8f7fb; --text: #1f2937; --muted: #6b7280; --border: #e7e5ee; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111015; --text: #ece9f3; --muted: #9b97a8; --border: #2c2a35; }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Noto Sans TC", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      text-align: center;
      padding: 20px;
    }
    h1 { font-size: 72px; margin: 0; font-weight: 900; letter-spacing: -0.04em; }
    p { color: var(--muted); margin: 8px 0 24px; }
    code { word-break: break-all; }
    a {
      display: inline-block;
      padding: 8px 18px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: inherit;
      text-decoration: none;
    }
    a:hover { border-color: currentColor; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>找不到 <code id="path"></code></p>
    <a href="/">回專案列表</a>
  </main>
  <script>
    document.getElementById("path").textContent = location.pathname;
  </script>
</body>
</html>
